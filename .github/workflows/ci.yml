name: CI

# Runs the test suite and a production build on every pull request, so a
# branch is known-green BEFORE it merges to main (deploy.yml only tests
# after merge, when a failure leaves main red until someone fixes it).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
